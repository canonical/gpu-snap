name: Refresh lists

on:
  workflow_dispatch:
    inputs:
      snaps:
        description: Space-separated `snap/channel:arch1,arch2` to update the lists for
        default: >
          mesa-core22/stable:amd64,armhf,arm64,ppc64el,riscv64
          mesa-2404/stable:amd64,armhf,arm64,ppc64el,riscv64,s390x
          mesa-2604/stable:amd64,armhf,arm64,ppc64el,riscv64,s390x

jobs:
  refresh-lists:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: graphics-core
          persist-credentials: false

      - name: Build the snap matrix
        id: snap-matrix
        env:
          SNAPS: ${{ inputs.snaps }}
        run: |
          MATRIX=()
          for snap in ${SNAPS}; do
            [[ $snap =~ ([^/]*)/(.*):(.*) ]]
            for arch in ${BASH_REMATCH[3]//,/ }; do
              MATRIX+=( ${BASH_REMATCH[1]} ${BASH_REMATCH[2]} $arch )
            done
          done
          echo "matrix=${MATRIX[@]}" >> $GITHUB_OUTPUT

      - name: Download the snaps
        env:
          SNAP_MATRIX: ${{ steps.snap-matrix.outputs.matrix }}
        run: |
          echo -n "${SNAP_MATRIX}" |
            xargs -d' ' -n3 -P`nproc` \
              bash -xc '
                UBUNTU_STORE_ARCH=$2 snap download $0 \
                  --channel $1 \
                  --basename $0_$2
              '

      - name: Unsquash the lists
        env:
          SNAP_MATRIX: ${{ steps.snap-matrix.outputs.matrix }}
        run: |
          echo -n "${SNAP_MATRIX}" |
            xargs -d' ' -n3 -P`nproc` \
              bash -xc "unsquashfs -cat \$0_\$2.snap snap/\$2.list \
                | sed 's/\(.so.[0-9]\+\)\([0-9\.]\+\)\?$/\1*/' \
                > graphics-core/lists/\$0.\$2.list"

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: graphics-core
          add-paths: lists/*
          branch: refresh-lists
          commit-message: |
            Refresh snap lists

            ${{ inputs.snaps }}
          committer: "Mir CI Bot <mir-ci-bot@canonical.com>"
          title: "Refresh snap lists"
